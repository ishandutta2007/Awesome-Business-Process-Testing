<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="node-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="node-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="node-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="node-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.8" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="tech-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.6" />
      <circle cx="40" cy="0" r="1.5" fill="#334155" />
    </pattern>

    <!-- Drop Shadow Filters -->
    <filter id="shadow-text" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <filter id="glow-card" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes dashFlow {
        0% { stroke-dashoffset: 48; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .flow-line {
        stroke-dasharray: 8 6;
        animation: dashFlow 2s linear infinite;
      }
      .flow-line-reverse {
        stroke-dasharray: 8 6;
        animation: dashFlow 2s linear infinite reverse;
      }
      .glowing-orb {
        transform-origin: center;
        animation: pulseGlow 6s ease-in-out infinite alternate;
      }
      .pill-float-1 {
        animation: floatSlow1 4s ease-in-out infinite;
      }
      .pill-float-2 {
        animation: floatSlow2 5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="420" fill="url(#tech-grid)" rx="16" />

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="120" r="180" fill="url(#glow-cyan)" class="glowing-orb" />
  <circle cx="1020" cy="300" r="220" fill="url(#glow-purple)" class="glowing-orb" />

  <!-- Dynamic Process Pipeline Background Graph -->
  <g id="pipeline-layer" opacity="0.45">
    <!-- Pipeline Connecting Paths -->
    <path d="M 80 80 Q 280 40 450 90 T 800 60 T 1120 110" fill="none" stroke="#0284C7" stroke-width="2.5" class="flow-line" />
    <path d="M 90 350 Q 320 390 600 340 T 950 360 T 1130 330" fill="none" stroke="#8B5CF6" stroke-width="2.5" class="flow-line-reverse" />
    <path d="M 120 180 L 260 300 L 460 350 L 740 320 L 980 200 L 1100 240" fill="none" stroke="#10B981" stroke-width="1.8" stroke-dasharray="4 4" />

    <!-- Connecting Circuit Nodes -->
    <circle cx="80" cy="80" r="6" fill="#38BDF8" />
    <circle cx="450" cy="90" r="5" fill="#818CF8" />
    <circle cx="800" cy="60" r="6" fill="#C084FC" />
    <circle cx="1120" cy="110" r="5" fill="#38BDF8" />

    <circle cx="90" cy="350" r="5" fill="#C084FC" />
    <circle cx="600" cy="340" r="6" fill="#10B981" />
    <circle cx="1130" cy="330" r="6" fill="#F59E0B" />
  </g>

  <!-- Interactive Floating Feature Pills (Non-Obtrusive, at Header/Footer Corners) -->
  <!-- Top Left Pill -->
  <g class="pill-float-1" transform="translate(70, 36)">
    <rect width="180" height="32" rx="16" fill="#1E293B" stroke="#0284C7" stroke-width="1.2" opacity="0.85" />
    <circle cx="20" cy="16" r="5" fill="#38BDF8" />
    <text x="34" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Enterprise ERP &amp; CRM</text>
  </g>

  <!-- Top Right Pill -->
  <g class="pill-float-2" transform="translate(940, 36)">
    <rect width="190" height="32" rx="16" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.2" opacity="0.85" />
    <circle cx="20" cy="16" r="5" fill="#C084FC" />
    <text x="34" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">AI Codeless Automation</text>
  </g>

  <!-- Bottom Left Pill -->
  <g class="pill-float-2" transform="translate(80, 354)">
    <rect width="195" height="32" rx="16" fill="#1E293B" stroke="#10B981" stroke-width="1.2" opacity="0.85" />
    <circle cx="20" cy="16" r="5" fill="#10B981" />
    <text x="34" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">End-to-End Validation</text>
  </g>

  <!-- Bottom Right Pill -->
  <g class="pill-float-1" transform="translate(940, 354)">
    <rect width="180" height="32" rx="16" fill="#1E293B" stroke="#F59E0B" stroke-width="1.2" opacity="0.85" />
    <circle cx="20" cy="16" r="5" fill="#F59E0B" />
    <text x="34" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Continuous Testing CI/CD</text>
  </g>

  <!-- Middle Workflow Node Demonstration Cards (Background Level) -->
  <g transform="translate(240, 290)" opacity="0.8">
    <rect width="150" height="42" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
    <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#93C5FD">⚙️ SAP / Oracle</text>
  </g>
  <g transform="translate(430, 290)" opacity="0.8">
    <rect width="150" height="42" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
    <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#A78BFA">🔄 Orchestrator</text>
  </g>
  <g transform="translate(620, 290)" opacity="0.8">
    <rect width="160" height="42" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
    <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#6EE7B7">☁️ Salesforce &amp; SNOW</text>
  </g>
  <g transform="translate(820, 290)" opacity="0.8">
    <rect width="140" height="42" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
    <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#FDE68A">✅ 0 Regressions</text>
  </g>

  <!-- Main Foreground Content - High Z-Order, Crisp Drop-Shadow, No Occlusion -->
  <g id="foreground-content" filter="url(#shadow-text)">
    <!-- Category Super-Title Badge -->
    <rect x="475" y="90" width="250" height="28" rx="14" fill="#1E293B" stroke="#6366F1" stroke-width="1.4" />
    <text x="600" y="108" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#A5B4FC" letter-spacing="1.5">ENTERPRISE QA &amp; AUTOMATION</text>

    <!-- Main Title -->
    <text x="600" y="168" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="44" fill="url(#primary-grad)" letter-spacing="-0.5">
      Awesome Business Process Testing
    </text>

    <!-- Subtitle Line 1 -->
    <text x="600" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#F1F5F9">
      Curated Ecosystem of SaaS Platforms, Codeless Automation &amp; Open-Source Frameworks
    </text>

    <!-- Subtitle Line 2 / Tagline -->
    <text x="600" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94A3B8">
      End-to-End Workflow Validation across SAP · Salesforce · ServiceNow · Oracle · Workday · Web · API
    </text>
  </g>

  <!-- Outer Border Highlight -->
  <rect width="1198" height="418" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.2" opacity="0.6" />
</svg>